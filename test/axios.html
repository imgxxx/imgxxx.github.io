<!-- app/static/index.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AdGuard Home · Multi-Instance</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #161c24;
    --border: #232c38;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #67c23a;
    --danger: #f56c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .badge {
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 6px; color: var(--muted); font-size: 12px;
  }
  main { padding: 24px; display: grid; gap: 20px; }
  section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px;
  }
  section h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); }
  button {
    background: #1f2a37; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06210b; border-color: transparent; font-weight: 600; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  input, select {
    background: #0d1218; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); }
  .pill.ok { color: var(--accent); border-color: var(--accent); }
  .pill.bad { color: var(--danger); border-color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: #0d1218; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  code { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AdGuard Home · Multi-Instance</h1>
  <span class="badge" id="summary">loading…</span>
  <button class="primary" onclick="refreshAll()">Refresh</button>
  <button onclick="toggleProtection(true)">Resume all</button>
  <button class="danger" onclick="toggleProtection(false)">Pause all</button>
</header>

<main>
  <section>
    <h2>Add instance</h2>
    <div class="row">
      <input id="i-name" placeholder="name" />
      <input id="i-url" placeholder="http://10.0.0.5:3000" size="28" />
      <input id="i-user" placeholder="admin" value="admin" />
      <input id="i-pass" placeholder="password" type="password" />
      <input id="i-tags" placeholder="tags (comma separated)" size="20" />
      <button class="primary" onclick="addInstance()">Add</button>
    </div>
  </section>

  <section>
    <h2>Instances</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>URL</th><th>Tags</th>
          <th>Status</th><th>Version</th><th>Protection</th><th></th>
        </tr>
      </thead>
      <tbody id="instances"><tr><td colspan="8"><code>loading…</code></td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>Aggregated statistics</h2>
    <div class="stats" id="stats"><code>loading…</code></div>
  </section>

  <section>
    <h2>Global actions</h2>
    <div class="row">
      <button onclick="clearCache()">Clear DNS cache (all)</button>
      <button onclick="refreshFilters()">Refresh filter lists (all)</button>
      <button onclick="resetStats()">Reset statistics (all)</button>
      <button onclick="clearQueryLog()">Clear query log (all)</button>
      <button onclick="setSafebrowsing(true)">Enable Safe Browsing</button>
      <button onclick="setSafebrowsing(false)">Disable Safe Browsing</button>
      <button onclick="setParental(true)">Enable Parental</button>
      <button onclick="setParental(false)">Disable Parental</button>
    </div>
  </section>

  <section>
    <h2>Set custom filtering rules on every instance</h2>
    <div class="row" style="align-items:flex-start">
      <textarea id="rules" rows="6" cols="70"
        style="background:#0d1218;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:ui-monospace,monospace">||ads.example.com^
@@||cdn.example.com^</textarea>
      <button class="primary" onclick="pushRules()">Push rules</button>
    </div>
  </section>
</main>

<script>
const api = (path, opts = {}) =>
  fetch(path, {
    headers: { "content-type": "application/json" },
    ...opts,
  }).then(async (r) => {
    const text = await r.text();
    let body;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    if (!r.ok) throw new Error(typeof body === "string" ? body : JSON.stringify(body));
    return body;
  });

const post = (p, b) => api(p, { method: "POST", body: b ? JSON.stringify(b) : undefined });
const put  = (p, b) => api(p, { method: "PUT",  body: b ? JSON.stringify(b) : undefined });
const del  = (p)    => api(p, { method: "DELETE" });

async function loadInstances() {
  const list = await api("/api/instances");
  const statuses = await api("/api/aggregate/status");
  const byId = Object.fromEntries(statuses.instances.map((r) => [r.instance_id, r]));

  const tbody = document.getElementById("instances");
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="8"><code>No instances yet.</code></td></tr>';
    return;
  }
  tbody.innerHTML = list.map((i) => {
    const st = byId[i.id] || {};
    const data = st.data || {};
    const ok = st.ok;
    return `<tr>
      <td>${i.id}</td>
      <td>${escapeHtml(i.name)}</td>
      <td><code>${escapeHtml(i.url)}</code></td>
      <td>${i.tags.map((t) => `<span class="pill">${escapeHtml(t)}</span>`).join(" ")}</td>
      <td><span class="pill ${ok ? "ok" : "bad"}">${ok ? "online" : "offline"}</span></td>
      <td>${ok ? escapeHtml(data.version || "?") : "—"}</td>
      <td>${ok ? (data.protection_enabled ? "🛡️ on" : "⏸ off") : "—"}</td>
      <td class="row">
        <button onclick="testInstance(${i.id})">Test</button>
        <button class="danger" onclick="removeInstance(${i.id})">Delete</button>
      </td>
    </tr>`;
  }).join("");

  const reachable = statuses.reachable;
  document.getElementById("summary").textContent =
    `${reachable}/${statuses.total} instances online`;
}

async function loadStats() {
  const el = document.getElementById("stats");
  try {
    const r = await api("/api/aggregate/stats");
    if (!r.ok) { el.innerHTML = "<code>no reachable instances</code>"; return; }
    const m = r.merged;
    el.innerHTML = [
      ["DNS queries", m.num_dns_queries],
      ["Blocked (filtering)", m.num_blocked_filtering],
      ["Safe Browsing", m.num_replaced_safebrowsing],
      ["Parental", m.num_replaced_parental],
      ["Safe Search", m.num_replaced_safesearch],
      ["Avg. processing (s)", (m.avg_processing_time || 0).toFixed(4)],
    ].map(([label, value]) =>
      `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`
    ).join("");
  } catch (e) {
    el.innerHTML = `<code>${escapeHtml(e.message)}</code>`;
  }
}

async function addInstance() {
  const payload = {
    name: document.getElementById("i-name").value.trim(),
    url: document.getElementById("i-url").value.trim(),
    username: document.getElementById("i-user").value.trim() || "admin",
    password: document.getElementById("i-pass").value,
    tags: document.getElementById("i-tags").value
      .split(",").map((s) => s.trim()).filter(Boolean),
  };
  if (!payload.name || !payload.url || !payload.password) {
    alert("name, url and password are required");
    return;
  }
  await post("/api/instances", payload);
  ["i-name", "i-url", "i-pass", "i-tags"].forEach((id) => (document.getElementById(id).value = ""));
  refreshAll();
}

async function removeInstance(id) {
  if (!confirm(`Delete instance #${id}?`)) return;
  await del(`/api/instances/${id}`);
  refreshAll();
}

async function testInstance(id) {
  const r = await post(`/api/instances/${id}/test`);
  alert(r.ok ? `OK (${r.latency_ms} ms)\n${JSON.stringify(r.status, null, 2)}`
             : `FAILED\n${r.error}`);
}

async function toggleProtection(enabled) {
  await post("/api/aggregate/protection", { enabled, duration: enabled ? null : 3600000 });
  refreshAll();
}

async function clearCache()        { await post("/api/aggregate/cache/clear"); refreshAll(); }
async function refreshFilters()    { await post("/api/aggregate/filtering/refresh"); }
async function resetStats()        { await post("/api/aggregate/stats/reset"); refreshAll(); }
async function clearQueryLog()     { await post("/api/aggregate/querylog/clear"); }
async function setSafebrowsing(on) { await post(`/api/aggregate/safebrowsing/${on ? "enable" : "disable"}`); }
async function setParental(on)     { await post(`/api/aggregate/parental/${on ? "enable" : "disable"}`); }

async function pushRules() {
  const rules = document.getElementById("rules").value
    .split("\n").map((s) => s.trim()).filter(Boolean);
  await post("/api/aggregate/filtering/rules", { rules });
  alert(`Pushed ${rules.length} rules.`);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function refreshAll() { loadInstances(); loadStats(); }

refreshAll();
</script>
</body>
</html>
