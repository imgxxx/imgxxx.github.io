<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清新云DNS - 24小时解析量监控看板</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #00cec9;
            --bg-color: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 206, 201, 0.05) 0%, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 主容器卡片 */
        .dashboard-card {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); /* 毛玻璃效果 */
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        /* 顶部装饰条 */
        .top-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 4px;
            margin-bottom: 30px;
        }

        /* 标题部分 */
        .header h2 {
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* 核心数字展示区 */
        .stats-container {
            margin: 30px 0;
        }

        .main-number {
            font-size: 64px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            /* 数字渐变效果 */
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .unit {
            font-size: 18px;
            color: var(--text-sub);
            margin-left: 8px;
            font-weight: 400;
        }

        /* 底部信息栏 */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
        }

        /* 呼吸灯效果的小圆点 */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .last-updated {
            color: var(--text-sub);
            font-size: 13px;
        }

        .last-updated span {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 动画定义 */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 206, 201, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 206, 201, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 206, 201, 0); }
        }

        /* 加载状态 */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        
        /* 1. 添加响应式字体 */
@media (max-width: 480px) {
    .main-number {
        font-size: 48px;
    }
}

/* 2. 兼容回退 */
@supports not (backdrop-filter: blur(20px)) {
    .dashboard-card {
        background: rgba(255,255,255,0.95);
    }
}

/* 3. 无障碍 - 减少动画 */
@media (prefers-reduced-motion: reduce) {
    .status-dot {
        animation: none;
        box-shadow: 0 0 0 4px rgba(0,206,201,0.4);
    }
    .dashboard-card:hover {
        transform: none;
    }
}

/* 4. 数字防溢出 */
.main-number {
    overflow-wrap: break-word;
    hyphens: auto;
}
        
    </style>
</head>
<body>

    <div class="dashboard-card" id="card">
        <div class="top-bar"></div>
        
        <div class="header">
            <h2>Total DNS Queries</h2>
        </div>

        <div class="stats-container">
            <!-- 数字将通过 JS 动态填入 -->
            <div class="main-number" id="total-queries">0</div>
            <span class="unit">Requests</span>
        </div>

        <div class="footer-info">
            <div class="status-badge">
                <div class="status-dot"></div>
                LIVE DATA
            </div>
            <div class="last-updated">
                Last Updated: <span id="update-time">--:--:--</span>
            </div>
        </div>
    </div>

    <script>
    // 使用常量定义API URL和刷新间隔
    const API_URL = "https://api.ipv4dns.com/api";
    const REFRESH_INTERVAL = 5000; // 5秒
    const ANIMATION_DURATION = 1000; // 1秒

    // 使用CSS类选择器缓存DOM元素
    const elements = {
        totalQueries: document.getElementById('total-queries'),
        updateTime: document.getElementById('update-time'),
        card: document.getElementById('card')
    };

    // 缓存常用函数引用
    const { requestAnimationFrame, parseInt, setTimeout } = window;

    // 数字滚动动画函数 - 优化版本
    function animateValue(element, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            
            // 使用更高效的缓动函数计算
            const easedProgress = easeOutQuart(progress);
            const currentValue = Math.floor(easedProgress * (end - start) + start);
            
            // 使用textContent代替innerHTML（更安全且性能更好）
            element.textContent = currentValue.toLocaleString();
            
            if (progress < 1) {
                requestAnimationFrame(step);
            }
        };
        requestAnimationFrame(step);
    }

    // 缓动函数 - 单独定义以便复用
    function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
    }

    // 防抖函数 - 防止频繁请求
    function debounce(func, delay) {
        let timeoutId;
        return function(...args) {
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            timeoutId = setTimeout(() => {
                func.apply(this, args);
            }, delay);
        };
    }

    // 获取并更新数据 - 优化版本
    const fetchData = debounce(async function() {
        try {
            // 添加加载状态
            elements.card.classList.add('loading');

            // 添加请求头和缓存控制
            const response = await fetch(API_URL, {
                headers: {
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            // 验证数据结构
            if (!data || typeof data.num_dns_queries !== 'number' || !data.timestamp) {
                throw new Error('Invalid data format');
            }

            // 获取当前显示的数字（去除逗号）
            const currentDisplayValue = parseInt(elements.totalQueries.textContent.replace(/,/g, '') || '0', 10);
            const newValue = data.num_dns_queries;

            // 如果数据没变，不执行动画，直接更新时间
            if (currentDisplayValue === newValue) {
                elements.updateTime.textContent = formatTime(data.timestamp);
                elements.card.classList.remove('loading');
                return;
            }

            // 执行数字滚动动画
            animateValue(elements.totalQueries, currentDisplayValue, newValue, ANIMATION_DURATION);

            // 更新时间
            elements.updateTime.textContent = formatTime(data.timestamp);

        } catch (error) {
            console.error('Fetch Error:', error);
            // 更友好的错误显示
            elements.totalQueries.textContent = "N/A";
            elements.updateTime.textContent = "Update Failed";
        } finally {
            // 确保移除加载状态
            setTimeout(() => {
                elements.card.classList.remove('loading');
            }, ANIMATION_DURATION);
        }
    }, 200); // 200ms防抖延迟

    // 格式化时间函数 - 优化版本
    function formatTime(isoString) {
        try {
            const date = new Date(isoString);
            if (isNaN(date.getTime())) throw new Error('Invalid date');
            
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).replace(/\//g, '-');
        } catch (error) {
            console.error('Date formatting error:', error);
            return 'Invalid Date';
        }
    }

    // 初始化
    (async function init() {
        try {
            await fetchData(); // 立即执行一次
            // 使用setInterval而不是递归setTimeout以获得更精确的间隔
            const intervalId = setInterval(fetchData, REFRESH_INTERVAL);
            
            // 清理函数 - 在组件卸载时调用
            if (typeof window !== 'undefined' && window.addEventListener) {
                window.addEventListener('beforeunload', () => {
                    clearInterval(intervalId);
                });
            }
        } catch (error) {
            console.error('Initialization error:', error);
        }
    })();
</script>
</body>
</html>
