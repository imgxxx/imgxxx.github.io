  <style>
    /* ===== 全部样式 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #2f6bff;
      --purple: #8b7bff;
      --pink: #ff9ad5;
      --ink: #0f1a2e;
      --sub: #5a6e8a;
      --bg: #f6f9fe;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: rgba(47,107,255,0.2); }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      z-index: 2;
    }
    @media (max-width: 768px) { .wrap { padding: 0 16px; } }
    @media (max-width: 480px) { .wrap { padding: 0 12px; } }

    /* ===== 背景光晕 ===== */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      will-change: transform;
    }
    .bg-glow span {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .35;
      will-change: transform;
    }
    .g1 {
      width: 40vw; height: 40vw;
      left: -10vw; top: -8vw;
      background: radial-gradient(circle, #c7d6ff, transparent 65%);
      animation: drift 28s ease-in-out infinite alternate;
    }
    .g2 {
      width: 34vw; height: 34vw;
      right: -8vw; top: 6vh;
      background: radial-gradient(circle, #ffd9f0, transparent 65%);
      animation: drift 32s ease-in-out infinite alternate-reverse;
    }
    .g3 {
      width: 38vw; height: 38vw;
      left: 18vw; top: 50vh;
      background: radial-gradient(circle, #d8ccff, transparent 65%);
      animation: drift 36s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(4vw,-3vh) scale(1.1); }
    }

    /* ===== 通用组件 ===== */
    .h-title {
      font-size: clamp(30px, 4.2vw, 44px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .h-sub {
      color: var(--sub);
      font-size: clamp(14px, 1.1vw, 17px);
      line-height: 1.8;
      margin-top: 14px;
      max-width: 540px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: .3s cubic-bezier(.2,.8,.2,1);
      border: none;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2f6bff, #5b8cff);
      color: #fff;
      padding: 14px 44px;
      box-shadow: 0 12px 32px rgba(47,107,255,.35);
    }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 20px 48px rgba(47,107,255,.45);
    }
    .btn-ghost {
      background: rgba(255,255,255,.6);
      color: var(--ink);
      padding: 8px 22px;
      border: 1px solid rgba(120,140,200,.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 14px;
    }
    @supports not (backdrop-filter: blur(1px)) {
      .btn-ghost { background: rgba(255,255,255,0.85); }
      .glass { background: rgba(255,255,255,0.85) !important; }
    }
    .btn-ghost:hover {
      background: #fff;
      box-shadow: 0 8px 24px rgba(80,100,180,.15);
    }
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: 1s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== 导航栏 ===== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 16px 0;
      transition: .3s;
    }
    header.scrolled {
      padding: 10px 0;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 30px rgba(60,80,180,.08);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 12px;
      min-height: 50px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 20px;
      color: var(--ink);
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      position: relative;
      background: linear-gradient(135deg, #2f6bff, #8b7bff);
      box-shadow: 0 6px 16px rgba(60,80,255,.35);
      flex-shrink: 0;
    }
    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 5px;
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.3));
    }
    .logo-mark::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 13px;
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: #2f6bff;
      z-index: 1;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
      flex-shrink: 0;
    }
    .nav-links a {
      color: #3d4260;
      font-size: 15px;
      text-decoration: none;
      font-weight: 500;
      transition: .3s;
      position: relative;
    }
    .nav-links a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      transition: .35s;
      transform: translateX(-50%);
    }
    .nav-links a:hover { color: var(--blue); }
    .nav-links a:hover::after { width: 100%; }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .lang-switch {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .lang-btn {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: .3s;
      flex-shrink: 0;
    }
    .lang-btn.active {
      color: var(--blue);
      background: rgba(47,107,255,.12);
    }
    .lang-btn:hover { color: var(--blue); }
    .lang-btn-mobile { display: none; }

    .nav-btns {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .nav-btns .btn-ghost { padding: 8px 18px; font-size: 14px; }
    .nav-btns .btn-primary { padding: 10px 28px; font-size: 14px; box-shadow: 0 8px 24px rgba(47,107,255,.3); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .hamburger span {
      width: 26px;
      height: 2.5px;
      background: var(--ink);
      border-radius: 2px;
      transition: .3s;
      display: block;
    }
    .mobile-menu { display: none; }

    @media (max-width: 768px) {
      header { padding: 12px 0; }
      .nav { gap: 6px; min-height: 44px; }
      .logo { font-size: 17px; gap: 8px; }
      .logo-mark { width: 30px; height: 30px; }
      .logo-mark::before { left: 11px; top: 11px; width: 7px; height: 7px; }
      .logo-mark::after { inset: 6px; }
      .nav-links { display: none; }
      .lang-btn { font-size: 12px; padding: 3px 6px; border-radius: 4px; }
      .lang-btn-full { display: none; }
      .lang-btn-mobile { display: inline-block; }
      .nav-btns .btn-ghost { display: none; }
      .nav-btns .btn-primary { padding: 6px 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(47,107,255,.25); }
      .hamburger { display: flex; padding: 2px 0 2px 4px; }
      .hamburger span { width: 22px; height: 2px; }
      .mobile-menu {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99;
        background: rgba(255,255,255,.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 90px 24px 30px;
        transform: translateY(-110%);
        transition: .45s cubic-bezier(.2,.8,.2,1);
        box-shadow: 0 30px 60px rgba(60,80,180,.15);
        border-radius: 0 0 24px 24px;
      }
      .mobile-menu.open { transform: translateY(0); }
      .mobile-menu a {
        display: block;
        font-size: 17px;
        font-weight: 700;
        color: var(--ink);
        text-decoration: none;
        padding: 14px 4px;
        border-bottom: 1px solid rgba(140,160,230,.12);
      }
      .mobile-menu .lang-switch-mobile {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        padding: 12px 4px;
        border-bottom: 1px solid rgba(140,160,230,.12);
      }
      .mobile-menu .lang-switch-mobile .lang-btn { font-size: 15px; padding: 4px 12px; }
      .mobile-menu .btn-primary { width: 100%; margin-top: 20px; }
    }
    @media (max-width: 420px) {
      .logo { font-size: 15px; gap: 6px; }
      .logo-mark { width: 26px; height: 26px; }
      .logo-mark::before { left: 9px; top: 9px; width: 6px; height: 6px; }
      .logo-mark::after { inset: 5px; }
      .nav-btns .btn-primary { padding: 5px 10px; font-size: 12px; }
      .lang-btn { font-size: 11px; padding: 2px 5px; }
      .hamburger span { width: 20px; height: 2px; }
      .nav-actions { gap: 6px; }
    }

    /* ===== Hero ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 0 60px;
      overflow: hidden;
      position: relative;
    }
    .hero-inner { position: relative; z-index: 3; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--blue);
      background: rgba(47,107,255,.08);
      border: 1px solid rgba(47,107,255,.2);
      padding: 6px 20px;
      border-radius: 999px;
      margin-bottom: 28px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fadeUp 1s .2s both;
    }
    .hero-badge i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 12px var(--blue);
      animation: pulse 1.6s infinite;
    }
    .hero h1 {
      font-size: clamp(44px, 8vw, 100px);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0f1a2e 30%, #3a4a8f 70%, #2f6bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeUp 1s .35s both;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #2f6bff, #8b7bff, #ff9ad5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      color: var(--sub);
      font-size: clamp(15px, 1.4vw, 19px);
      margin-top: 20px;
      animation: fadeUp 1s .5s both;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .hero .btn-primary {
      margin-top: 40px;
      animation: fadeUp 1s .65s both;
      position: relative;
    }
    .hero .btn-primary::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      border: 2px solid rgba(47,107,255,.3);
      animation: ringPulse 2.2s infinite;
    }
    @keyframes ringPulse {
      0% { transform: scale(.95); opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .3; }
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0) rotate(var(--r,0deg)); }
      50% { transform: translateY(-18px) rotate(calc(var(--r,0deg) + 2deg)); }
    }
    @keyframes floaty2 {
      0%,100% { transform: translateY(0) rotate(var(--r,0deg)) scale(1); }
      50% { transform: translateY(-26px) rotate(calc(var(--r,0deg) - 3deg)) scale(1.03); }
    }

    .hero-shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .shape {
      position: absolute;
      will-change: transform;
    }
    .shape .glass {
      background: linear-gradient(135deg,rgba(255,182,193,0.45),rgba(200,180,255,0.45),rgba(180,200,255,0.45),rgba(200,210,220,0.35));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 20px 40px rgba(100,120,220,0.15);
    }
    .pyramid { left: 4%; top: 22%; animation: floaty2 8s ease-in-out infinite; --r: -6deg; }
    .pyramid .glass { width: clamp(80px,14vw,180px); height: clamp(80px,14vw,180px); clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
    .cube { right: 5%; top: 20%; animation: floaty 9s ease-in-out infinite; --r: 12deg; }
    .cube .glass { width: clamp(70px,12vw,150px); height: clamp(70px,12vw,150px); border-radius: 22px; transform: rotate(12deg) skewY(-3deg); }
    .sphere { right: 12%; bottom: 22%; animation: floaty2 10s ease-in-out infinite; --r: 0deg; }
    .sphere .glass { width: clamp(50px,8vw,100px); height: clamp(50px,8vw,100px); border-radius: 50%; }
    .diamond { left: 18%; top: 12%; animation: floaty 11s ease-in-out infinite; --r: 20deg; }
    .diamond .glass { width: clamp(60px,9vw,120px); height: clamp(60px,9vw,120px); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); transform: rotate(15deg); }
    .hexagon { right: 20%; top: 8%; animation: floaty2 12s ease-in-out infinite; --r: -10deg; }
    .hexagon .glass { width: clamp(65px,10vw,130px); height: clamp(65px,10vw,130px); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    .ring { left: 8%; bottom: 18%; animation: floaty 13s ease-in-out infinite; --r: 5deg; }
    .ring .glass { width: clamp(70px,11vw,140px); height: clamp(70px,11vw,140px); border-radius: 50%; border: 8px solid rgba(255,255,255,0.6); background: rgba(200,180,255,0.15); backdrop-filter: blur(4px); box-shadow: 0 0 0 2px rgba(255,255,255,0.2),0 20px 40px rgba(100,120,220,0.1); }
    .pyramid-base {
      position: absolute;
      left: -14%;
      top: 82%;
      width: 128%;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(200,180,255,0.25), transparent 70%);
      filter: blur(6px);
    }
    @media (max-width:768px) { .pyramid{left:2%;top:18%} .cube{right:2%;top:16%} .sphere{right:6%;bottom:16%} .diamond{left:14%;top:8%} .hexagon{right:14%;top:4%} .ring{left:4%;bottom:12%} }
    @media (max-width:480px) { .pyramid{left:1%;top:14%} .cube{right:1%;top:12%} .sphere{right:4%;bottom:12%} .diamond{left:12%;top:6%} .hexagon{right:12%;top:2%} .ring{left:2%;bottom:8%} }

    .scroll-hint {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #9aa4c8;
      font-size: 12px;
      letter-spacing: .3em;
      animation: fadeUp 1s 1.2s both;
    }
    .scroll-hint::after {
      content: "";
      width: 1px;
      height: 36px;
      background: linear-gradient(180deg,#9aa4c8,transparent);
      animation: hint 1.8s infinite;
    }
    @keyframes hint {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      51% { transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (max-width:768px) { .scroll-hint{ bottom:20px; font-size:10px; letter-spacing:.2em } .scroll-hint::after{ height:28px } }

    /* ===== 第二板块：一站式加密DNS ===== */
    .sec-tool { padding: 120px 0 100px; overflow: hidden; }
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .tool-copy .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: .15em;
      margin-bottom: 18px;
    }
    .tool-copy .kicker::before { content: ""; width: 34px; height: 2px; background: linear-gradient(90deg,var(--purple),transparent); border-radius: 2px; }
    .feat-list { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; }
    .feat-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(160,175,235,.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(100,120,220,.06);
      transition: .3s;
      cursor: default;
    }
    @supports not (backdrop-filter: blur(1px)) { .feat-item { background: rgba(255,255,255,0.85); } }
    .feat-item:hover { transform: translateX(6px); box-shadow: 0 14px 36px rgba(100,120,220,.12); background: rgba(255,255,255,.85); }
    .feat-icon {
      width: 44px; height: 44px; border-radius: 13px;
      display: grid; place-items: center; flex: none;
      background: linear-gradient(135deg,rgba(47,107,255,.12),rgba(139,123,255,.12));
      border: 1px solid rgba(47,107,255,.2);
    }
    .feat-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .feat-icon svg .p { stroke: var(--purple); }
    .feat-icon svg .g { stroke: #22c55e; }
    .feat-icon svg .o { stroke: #f59e0b; }
    .feat-item h4 { font-size: 16px; font-weight: 700; }
    .feat-item p { font-size: 13px; color: var(--sub); margin-top: 2px; }

    .dns-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 460px;
      overflow: hidden;
      border-radius: 40px;
    }
    .dns-halo {
      position: absolute;
      width: 380px; height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle,rgba(160,180,255,.3),transparent 65%);
      filter: blur(24px);
      animation: pulse 5s ease-in-out infinite;
    }
    .dns-float-wrap {
      position: relative;
      animation: floaty 7s ease-in-out infinite;
      width: 260px; height: 260px;
    }
    .dns-core {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(190,200,255,.5) 55%, rgba(150,165,255,.45));
      border: 1px solid rgba(255,255,255,.95);
      backdrop-filter: blur(6px);

    .stats-status { font-size:12px; font-weight:700; color:var(--sub); letter-spacing:.04em; transition:color .5s; cursor:default; }
    .stats-status.is-error { color:#dc2626; cursor:pointer; text-decoration:underline; }

    .stats-title { font-size:clamp(18px,2.2vw,24px); font-weight:900; margin-top:14px; }

    .stats-label { display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:6px; flex-wrap:wrap; }

    .stats-time {
