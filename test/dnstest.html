<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS实时统计大屏</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #8b5cf6;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 侧边栏菜单 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
            z-index: 1000;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .menu-item:hover, .menu-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), transparent);
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        .menu-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* 主内容区 */
        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        .header {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1), transparent);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: var(--primary-color);
            font-size: 2rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* 统计卡片区域 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .stat-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* API状态脉冲灯 */
        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .pulse-container {
            position: relative;
            width: 12px;
            height: 12px;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid;
            animation: pulse-expand 2s infinite;
            opacity: 0;
        }

        .pulse-dot.success {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .pulse-dot.success + .pulse-ring {
            border-color: var(--success-color);
        }

        .pulse-dot.error {
            background: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }

        .pulse-dot.error + .pulse-ring {
            border-color: var(--danger-color);
        }

        @keyframes pulse-expand {
            0% {
                width: 12px;
                height: 12px;
                opacity: 1;
            }
            100% {
                width: 40px;
                height: 40px;
                opacity: 0;
            }
        }

        .api-status-text {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .api-status-text.success {
            color: var(--success-color);
        }

        .api-status-text.error {
            color: var(--danger-color);
        }

        /* 底部按钮区域 */
        .footer-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: auto;
        }

        .action-card {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .action-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .action-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            transition: transform 0.3s ease;
        }

        .action-card:hover .action-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .action-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .action-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* 移动端菜单按钮 */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            background: var(--primary-color);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 80px 15px 20px;
            }

            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .stat-value {
                font-size: 2rem;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .footer-actions {
                grid-template-columns: 1fr;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 数字滚动效果 */
        .number-scroll {
            display: inline-block;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05), transparent);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            z-index: -1;
            pointer-events: none;
        }

        .bg-decoration-2 {
            position: fixed;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.05), transparent);
            border-radius: 50%;
            top: 100px;
            left: -50px;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 移动端菜单按钮 -->
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-globe"></i> DNS监控</h2>
        </div>
        <nav>
            <div class="menu-item active">
                <i class="fas fa-chart-line"></i>
                <span>实时统计</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-map-marked-alt"></i>
                <span>地理分布</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-chart-bar"></i>
                <span>数据分析</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-cog"></i>
                <span>系统设置</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-bell"></i>
                <span>告警中心</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-question-circle"></i>
                <span>帮助文档</span>
            </div>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 背景装饰 -->
        <div class="bg-decoration"></div>
        <div class="bg-decoration-2"></div>

        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-network-wired"></i>
                    DNS实时统计大屏
                </h1>
                <p>实时监控全球DNS解析请求，提供精准的域名系统查询数据统计与分析</p>
            </div>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-container">
            <!-- DNS总量卡片 -->
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">DNS查询总量</span>
                    <div class="stat-icon">
                        <i class="fas fa-server"></i>
                    </div>
                </div>
                <div class="stat-value number-scroll" id="dnsCount">0</div>
                <div class="stat-label">累计查询次数</div>
                
                <div class="api-status">
                    <div class="pulse-container">
                        <div class="pulse-dot" id="pulseDot"></div>
                        <div class="pulse-ring"></div>
                    </div>
                    <span class="api-status-text" id="apiStatusText">连接中...</span>
                </div>
            </div>

            <!-- 最后更新时间卡片 -->
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">最后更新时间</span>
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
                <div class="stat-value" id="updateTime" style="font-size: 1.5rem;">--</div>
                <div class="stat-label">数据刷新时间戳</div>
                
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary);">
                        <i class="fas fa-sync-alt" style="color: var(--success-color);"></i>
                        <span>自动刷新间隔：30秒</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部操作按钮 -->
        <div class="footer-actions">
            <a href="https://www.example.com" target="_blank" class="action-card">
                <div class="action-icon">
                    <i class="fas fa-external-link-alt"></i>
                </div>
                <div class="action-title">前往官网</div>
                <div class="action-desc">访问我们的官方网站，了解更多产品信息</div>
            </a>

            <a href="mailto:support@example.com" class="action-card">
                <div class="action-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="action-title">联系我们</div>
                <div class="action-desc">如有任何问题，欢迎通过邮件与我们取得联系</div>
            </a>

            <a href="https://github.com" target="_blank" class="action-card">
                <div class="action-icon">
                    <i class="fab fa-github"></i>
                </div>
                <div class="action-title">技术文档</div>
                <div class="action-desc">查看API文档和技术支持资源</div>
            </a>
        </div>
    </main>

    <script>
        // API配置
        const API_URL = 'http://106.53.85.146:5000/api';
        let currentDnsCount = 0;
        let isApiConnected = false;

        // 数字滚动动画函数
        function animateNumber(element, start, end, duration) {
            const range = end - start;
            const increment = range / (duration / 16);
            let current = start;
            
            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    current = end;
                    clearInterval(timer);
                }
                element.textContent = Math.floor(current).toLocaleString();
            }, 16);
        }

        // 格式化时间
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 更新API状态
        function updateApiStatus(connected) {
            const pulseDot = document.getElementById('pulseDot');
            const apiStatusText = document.getElementById('apiStatusText');
            
            isApiConnected = connected;
            
            if (connected) {
                pulseDot.className = 'pulse-dot success';
                apiStatusText.textContent = 'API连接正常';
                apiStatusText.className = 'api-status-text success';
            } else {
                pulseDot.className = 'pulse-dot error';
                apiStatusText.textContent = 'API连接失败';
                apiStatusText.className = 'api-status-text error';
            }
        }

        // 获取数据
        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                
                // 更新API状态为成功
                updateApiStatus(true);
                
                // 数字滚动动画
                const dnsCountElement = document.getElementById('dnsCount');
                animateNumber(dnsCountElement, currentDnsCount, data.num_dns_queries, 1000);
                currentDnsCount = data.num_dns_queries;
                
                // 更新时间
                const updateTimeElement = document.getElementById('updateTime');
                updateTimeElement.textContent = formatDateTime(data.timestamp);
                
            } catch (error) {
                console.error('API请求失败:', error);
                updateApiStatus(false);
                
                // 即使失败也更新时间显示
                const now = new Date();
                const updateTimeElement = document.getElementById('updateTime');
                updateTimeElement.textContent = formatDateTime(now.toISOString());
            }
        }

        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // 菜单项点击事件
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                // 移动端自动关闭菜单
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('active');
                }
            });
        });

        // 点击侧边栏外部关闭菜单
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            
            if (window.innerWidth <= 768 && 
                !sidebar.contains(e.target) && 
                !menuToggle.contains(e.target) && 
                sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
            }
        });

        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            fetchData();
            
            // 每30秒自动刷新
            setInterval(fetchData, 30000);
        });

        // 防止页面刷新时丢失状态
        window.addEventListener('beforeunload', function() {
            localStorage.setItem('dnsCount', currentDnsCount);
        });

        // 页面加载时恢复状态
        window.addEventListener('load', function() {
            const savedCount = localStorage.getItem('dnsCount');
            if (savedCount) {
                currentDnsCount = parseInt(savedCount);
            }
        });
    </script>
</body>
</html>
