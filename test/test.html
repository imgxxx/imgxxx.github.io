<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态指示器</title>

    <!-- Tailwind CSS v3 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 自定义 Tailwind 配色和工具类 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-green': '#39ff14',
                        'amber-400': '#fbbf24',
                    }
                }
            }
        }
    </script>

    <style>
        /* 毛玻璃效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        /* 深色背景氛围 */
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 让脉冲动画更柔和 */
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="text-white">

    <!-- ========== 主内容区域 ========== -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-neon-green to-cyan-400 bg-clip-text text-transparent">
            服务监控面板
        </h1>
        <p class="text-gray-400 mt-2 text-sm">实时显示服务运行状态与网络延迟</p>
    </div>

    <!-- ========== 核心组件：状态指示器 ========== -->
    <div class="mt-5 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card">
        <!-- 脉冲指示灯 -->
        <span class="relative flex w-2 h-2">
            <span class="absolute inline-flex h-full w-full rounded-full bg-neon-green opacity-75 animate-ping"></span>
            <span class="relative inline-flex w-2 h-2 rounded-full bg-neon-green"></span>
        </span>

        <!-- 状态文本 + 延迟数值 -->
        <span class="text-xs text-gray-300">
            服务运行中 · 延迟 
            <span id="latency" class="font-medium text-amber-400">140 ms</span>
        </span>

        <!-- 刷新按钮 -->
        <button onclick="measureLatency()" 
                class="ml-0.5 text-gray-500 hover:text-neon-green transition-colors" 
                title="重新测速"
                aria-label="重新测速">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path>
                <path d="M21 3v5h-5"></path>
            </svg>
        </button>
    </div>

    <!-- ========== 模拟数据面板 ========== -->
    <div class="mt-8 glass-card rounded-2xl p-6 w-80">
        <h3 class="text-sm font-semibold text-gray-300 mb-4">📊 测速历史</h3>
        <div id="history" class="space-y-2 text-xs font-mono">
            <p class="text-gray-500">暂无数据，点击 🔄 开始测速</p>
        </div>
    </div>

    <!-- ========== JavaScript 逻辑 ========== -->
    <script>
        const latencyEl = document.getElementById('latency');
        const historyEl = document.getElementById('history');

        /**
         * 模拟测量网络延迟
         * 实际项目中可替换为真实 fetch 请求：
         *   const start = performance.now();
         *   await fetch('/api/ping');
         *   const latency = Math.round(performance.now() - start);
         */
        function measureLatency() {
            // 模拟网络波动：80ms ~ 300ms
            const fakeLatency = Math.floor(Math.random() * 220) + 80;

            // 更新显示（带动画）
            latencyEl.style.transition = 'all 0.3s ease';
            latencyEl.style.transform = 'scale(1.2)';
            latencyEl.textContent = fakeLatency + ' ms';

            setTimeout(() => {
                latencyEl.style.transform = 'scale(1)';
            }, 300);

            // 添加历史记录
            addHistory(fakeLatency);
        }

        /**
         * 添加测速历史记录
         */
        function addHistory(ms) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            // 颜色根据延迟分级
            let colorClass = 'text-neon-green';       // < 100ms 优秀
            if (ms >= 100 && ms < 200) colorClass = 'text-amber-400';  // 中等
            if (ms >= 200) colorClass = 'text-red-400';                // 较差

            const entry = document.createElement('div');
            entry.className = 'flex justify-between items-center animate-fade-in';
            entry.innerHTML = `
                <span class="text-gray-500">${timeStr}</span>
                <span class="${colorClass} font-semibold">${ms} ms</span>
            `;

            // 清除"暂无数据"提示
            if (historyEl.querySelector('.text-gray-500')) {
                historyEl.innerHTML = '';
            }

            // 插入到最前面
            historyEl.prepend(entry);

            // 最多保留 10 条
            while (historyEl.children.length > 10) {
                historyEl.removeChild(historyEl.lastChild);
            }
        }

        // 页面加载时自动测速一次
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(measureLatency, 800);
        });
    </script>

    <!-- 淡入动画（内联 style 避免额外文件） -->
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.4s ease-out;
        }
    </style>

<!-- ==================== 放在官网 </body> 之前 ==================== -->

<style>
  /* ===== 自定义动画（避免 Tailwind 重复编译） ===== */
  @keyframes neon-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.15); }
  }
  .neon-pulse { animation: neon-pulse 2s ease-in-out infinite; }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-up { animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* ===== Glass 磨砂卡片 ===== */
  .glass-card {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border: 1px solid rgba(148, 163, 184, 0.12);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* ===== 响应式微调 ===== */
  @media (max-width: 640px) {
    .status-bar { font-size: 0.75rem; }
  }
</style>

<!-- ===== 状态指示器容器 ===== -->
<div id="service-status" class="fixed bottom-4 right-4 z-50 slide-up" style="display:none;">
  <div class="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-full glass-card status-bar">

    <!-- 动态指示灯 -->
    <span class="relative flex w-2.5 h-2.5 flex-shrink-0" id="status-dot">
      <span class="absolute inline-flex h-full w-full rounded-full bg-neon-green opacity-75 animate-ping"></span>
      <span class="relative inline-flex w-2.5 h-2.5 rounded-full bg-neon-green neon-pulse"></span>
    </span>

    <!-- 文字信息 -->
    <span class="text-xs text-gray-300 whitespace-nowrap">
      服务运行中
      <span class="mx-1 text-gray-600">·</span>
      延迟
      <span id="latency" class="font-semibold text-amber-400 tabular-nums">-- ms</span>
    </span>

    <!-- 手动刷新按钮 -->
    <button
      id="refresh-btn"
      onclick="measureLatency()"
      class="ml-1 text-gray-500 hover:text-neon-green transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-neon-green/50 rounded-full p-0.5"
      title="重新测速"
      aria-label="重新测速"
    >
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path>
        <path d="M21 3v5h-5"></path>
      </svg>
    </button>

    <!-- 状态徽章（可选：显示在线/离线） -->
    <span id="status-badge" class="hidden text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">ONLINE</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  配置区 —— 根据你的实际情况修改
  // ============================================================
  const CONFIG = {
    // 测速端点（必须支持 CORS 或同源）
    latencyUrl: '/api/health',        // 改成你的后端健康检查接口
    // 如果没有后端，用公共 CDN 资源：
    // latencyUrl: 'https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js',

    // 自动刷新间隔（毫秒）
    autoRefreshInterval: 3000,

    // 超时时间（毫秒）—— 超过则判定为"离线"
    timeout: 5000,

    // 最大保留历史记录数（用于计算平均延迟）
    historySize: 5,
  };

  // ============================================================
  //  状态变量
  // ============================================================
  let latencyHistory = [];
  let autoRefreshTimer = null;
  let isFirstLoad = true;

  // DOM 缓存（只查询一次）
  const $latency     = document.getElementById('latency');
  const $statusDot   = document.getElementById('status-dot');
  const $statusBadge = document.getElementById('status-badge');
  const $container   = document.getElementById('service-status');
  const $refreshBtn  = document.getElementById('refresh-btn');

  // ============================================================
  //  工具函数：防抖 + 节流
  // ============================================================
  function throttle(fn, delay) {
    let last = 0;
    return function (...args) {
      const now = Date.now();
      if (now - last >= delay) { last = now; return fn.apply(this, args); }
    };
  }

  // ============================================================
  //  核心：测速逻辑（使用 performance.now 高精度）
  // ============================================================
  async function measureLatency() {
    // 防止重复点击
    if ($refreshBtn.classList.contains('measuring')) return;
    $refreshBtn.classList.add('measuring');

    const start = performance.now();

    try {
      // 方法1：fetch（推荐，支持 abort 超时控制）
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), CONFIG.timeout);

      const response = await fetch(CONFIG.latencyUrl, {
        method: 'HEAD',          // HEAD 比 GET 轻量（不下载 body）
        cache: 'no-store',       // 强制每次都走网络
        signal: controller.signal,
        mode: 'cors',            // 需要后端允许跨域
      });

      clearTimeout(timeoutId);

      // 即使是 HEAD，也可能没有 Content-Length，所以计算往返时间
      const elapsed = Math.round(performance.now() - start);

      updateUI(elapsed, true);

    } catch (err) {
      // 请求失败（超时 / 网络错误 / CORS）
      const elapsed = Math.round(performance.now() - start);
      console.warn('[Status] 测速失败:', err.message, elapsed);
      updateUI(null, false, elapsed > CONFIG.timeout ? '离线' : '不稳定');
    } finally {
      $refreshBtn.classList.remove('measuring');
    }
  }

  // ============================================================
  //  更新 UI（单次 DOM 操作）
  // ============================================================
  function updateUI(latency, isOnline, statusText) {
    // 显示容器
    $container.style.display = 'block';

    // 更新数字（使用 tabular-nums 防止抖动）
    if (latency !== null) {
      $latency.textContent = latency + ' ms';

      // 保存历史
      latencyHistory.push(latency);
      if (latencyHistory.length > CONFIG.historySize) latencyHistory.shift();

      // 根据延迟换色
      if (latency < 100) {
        $latency.className = 'font-semibold text-emerald-400 tabular-nums';
        $statusDot.querySelectorAll('span').forEach(s => s.style.backgroundColor = '#22c55e');
      } else if (latency < 300) {
        $latency.className = 'font-semibold text-amber-400 tabular-nums';
        $statusDot.querySelectorAll('span').forEach(s => s.style.backgroundColor = '#f59e0b');
      } else {
        $latency.className = 'font-semibold text-red-400 tabular-nums';
        $statusDot.querySelectorAll('span').forEach(s => s.style.backgroundColor = '#ef4444');
      }

      // 显示 ONLINE 徽章
      $statusBadge.textContent = 'ONLINE';
      $statusBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400';

    } else {
      $latency.textContent = '-- ms';
      $latency.className = 'font-semibold text-gray-500 tabular-nums';
      $statusBadge.textContent = statusText || 'OFFLINE';
      $statusBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-500/20 text-red-400';

      // 离线时指示灯变红
      $statusDot.querySelectorAll('span').forEach(s => s.style.backgroundColor = '#ef4444');
    }

    // 首次加载后不再播放入场动画
    if (isFirstLoad) {
      $container.classList.remove('slide-up');
      isFirstLoad = false;
    }
  }

  // ============================================================
  //  自动刷新调度器（使用 requestIdleCallback 节流）
  // ============================================================
  function scheduleAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);

    autoRefreshTimer = setInterval(() => {
      measureLatency();
    }, CONFIG.autoRefreshInterval);

    // 页面隐藏时暂停（省电 + 省带宽）
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(autoRefreshTimer);
      } else {
        scheduleAutoRefresh();
        measureLatency(); // 回到前台立刻测一次
      }
    }, { once: false });
  }

  // ============================================================
  //  初始化（使用 IntersectionObserver 懒加载）
  // ============================================================
  function init() {
    // 方法A：IntersectionObserver（元素进入视口才开始）
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          scheduleAutoRefresh();
          measureLatency();
          observer.disconnect(); // 只触发一次
        }
      });
    }, { threshold: 0.1 });

    observer.observe($container);

    // 方法B（兜底）：如果观察器不支持，直接启动
    if (!('IntersectionObserver' in window)) {
      scheduleAutoRefresh();
      measureLatency();
    }
  }

  // ============================================================
  //  启动
  // ============================================================
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>


</body>
</html>
