<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清新云DNS - 24小时解析量监控看板</title>
    <header class="header">
    <h1>清新云DNS24小时请求量统计</h1>
      <p>实时统计 DNS 解析请求，覆盖 <strong>128+</strong> 节点、<strong>10W+</strong> 日均查询量。本系统通过智能缓存与请求去重策略，确保数据精准且高效呈现。</p>
    </header>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #00cec9;
            --bg-color: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 206, 201, 0.05) 0%, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 主容器卡片 */
        .dashboard-card {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); /* 毛玻璃效果 */
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        /* 顶部装饰条 */
        .top-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 4px;
            margin-bottom: 30px;
        }

        /* 标题部分 */
        .header h2 {
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* 核心数字展示区 */
        .stats-container {
            margin: 30px 0;
        }

        .main-number {
            font-size: 64px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            /* 数字渐变效果 */
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .unit {
            font-size: 18px;
            color: var(--text-sub);
            margin-left: 8px;
            font-weight: 400;
        }

        /* 底部信息栏 */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
        }

        /* 呼吸灯效果的小圆点 */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .last-updated {
            color: var(--text-sub);
            font-size: 13px;
        }

        .last-updated span {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 动画定义 */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 206, 201, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 206, 201, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 206, 201, 0); }
        }

        /* 加载状态 */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        
        /* 1. 添加响应式字体 */
@media (max-width: 480px) {
    .main-number {
        font-size: 48px;
    }
}

/* 2. 兼容回退 */
@supports not (backdrop-filter: blur(20px)) {
    .dashboard-card {
        background: rgba(255,255,255,0.95);
    }
}

/* 3. 无障碍 - 减少动画 */
@media (prefers-reduced-motion: reduce) {
    .status-dot {
        animation: none;
        box-shadow: 0 0 0 4px rgba(0,206,201,0.4);
    }
    .dashboard-card:hover {
        transform: none;
    }
}

/* 4. 数字防溢出 */
.main-number {
    overflow-wrap: break-word;
    hyphens: auto;
}
        
    </style>
</head>
<body>

    <div class="dashboard-card" id="card">
        <div class="top-bar"></div>
        
        <div class="header">
            <h2>Total DNS Queries</h2>
        </div>

        <div class="stats-container">
            <!-- 数字将通过 JS 动态填入 -->
            <div class="main-number" id="total-queries">0</div>
            <span class="unit">Requests</span>
        </div>

        <div class="footer-info">
            <div class="status-badge">
                <div class="status-dot"></div>
                LIVE DATA
            </div>
            <div class="last-updated">
                Last Updated: <span id="update-time">--:--:--</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://api.ipv4dns.com/api";
        
        // 获取 DOM 元素
        const totalQueriesEl = document.getElementById('total-queries');
        const updateTimeEl = document.getElementById('update-time');
        const cardEl = document.getElementById('card');

        // 数字滚动动画函数
        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // 使用 easeOutQuart 缓动函数
                const currentValue = Math.floor(progress * (end - start) + start);
                element.innerHTML = currentValue.toLocaleString(); // 添加千位分隔符
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // 获取并更新数据
        async function fetchData() {
            try {
                // 添加加载状态
                cardEl.classList.add('loading');

                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // 获取当前显示的数字（去除逗号）
                const currentDisplayValue = parseInt(totalQueriesEl.innerText.replace(/,/g, '')) || 0;
                const newValue = data.num_dns_queries;

                // 如果数据没变，不执行动画，直接更新时间
                if (currentDisplayValue === newValue) {
                    updateTimeEl.textContent = formatTime(data.timestamp);
                    cardEl.classList.remove('loading');
                    return;
                }

                // 执行数字滚动动画
                animateValue(totalQueriesEl, currentDisplayValue, newValue, 1000);

                // 更新时间
                updateTimeEl.textContent = formatTime(data.timestamp);

                // 移除加载状态
                setTimeout(() => {
                    cardEl.classList.remove('loading');
                }, 1000);

            } catch (error) {
                console.error('Fetch Error:', error);
                totalQueriesEl.innerText = "Error";
                updateTimeEl.textContent = "Connection Failed";
                cardEl.classList.remove('loading');
            }
        }

        // 格式化时间函数
        function formatTime(isoString) {
            const date = new Date(isoString);
            // 转换为本地时间字符串，例如：2023/10/27 15:30:01
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).replace(/\//g, '-');
        }

        // 初始化：页面加载时立即执行一次
        fetchData();

        // 设置定时器：每 5 秒自动刷新一次 (5000 毫秒)
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
